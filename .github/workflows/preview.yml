name: preview

# A Hosting preview channel per pull request, so a change can be walked
# through on a real URL next to the artboards before it reaches main.
on:
  pull_request:

# One channel per pull request, so two pushes must not race it. Without this,
# the second build can finish first and the comment advertises the older commit.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Without a Firebase project there is nothing to deploy to, and a fork
    # pull request gets no secrets — the repo is public, so an empty
    # FIREBASE_SERVICE_ACCOUNT would fail the deploy step on every outside
    # contribution. Skip rather than fail in both cases. Setting the variable
    # turns the first half back on, no edit needed.
    if: >-
      ${{ vars.FIREBASE_PROJECT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 14d
